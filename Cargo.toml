[package]
name = "pyfgsea"
# Single version source: maturin uses this Cargo version for Python metadata.
version = "0.2.0-rc8"
edition = "2021"
description = "Python-first, Rust-backed gene set enrichment analysis"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shayuanxukuang/pyfgsea"
include = [
    "/.cargo/config.toml",
    "/Cargo.lock",
    "/Cargo.toml",
    "/CITATION.cff",
    "/examples/trajectory_demo.py",
    "/LICENSE",
    "/README.md",
    "/pyfgsea/**/*.json",
    "/pyfgsea/**/*.py",
    "/pyproject.toml",
    "/repro/data/toy_pathways.gmt",
    "/repro/data/toy_trajectory.h5ad",
    "/src/**/*.rs",
]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# Build one abi3 extension that can run on supported Python versions.
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = "0.20"

# Random-number generators used by the multilevel estimator.
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3.1"
rand_distr = "0.4"

# Parallel execution for native kernels.
rayon = "1.8"
statrs = "0.17.1"
