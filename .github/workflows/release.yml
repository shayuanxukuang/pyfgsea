name: Manual release-build preview (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #构建 Linux, Windows, macOS 的 Wheels
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Build the abi3 wheels from the declared minimum Python release.
          python-version: '3.9'
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: 'true'
          
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  #构建源码包
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Publication is intentionally absent. The final workflow must consume the
  # exact artifacts and receipts produced by the artifact-chain gate rather
  # than rebuilding unrelated files in a second workflow.
