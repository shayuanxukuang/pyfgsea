name: PyFgsea release checks

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pyfgsea-artifact-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "1.92.0"
  MATURIN_VERSION: "1.10.2"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "60"

jobs:
  release-ref-gate:
    name: Check release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      release_tag_object: ${{ steps.verify.outputs.release_tag_object }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
    steps:
      - name: Check out the event ref with tag objects and no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify annotated tag and immutable event commit
        id: verify
        shell: bash
        env:
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_REF_TYPE" != "tag" ]]; then
            echo "Artifact verification requires a tag ref." >&2
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]; then
            echo "Unexpected release tag: $EVENT_REF_NAME" >&2
            exit 1
          fi
          tag_ref="refs/tags/$EVENT_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          peeled="$(git rev-parse "$tag_ref^{commit}")"
          test "$peeled" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "release_tag=$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag_object=$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"
          echo "release_commit=$peeled" >> "$GITHUB_OUTPUT"

  artifact-chain:
    name: Build and test wheel (${{ matrix.key }})
    needs: release-ref-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-24.04
          - key: windows-x86_64
            runner: windows-2022
          - key: macos-arm64
            runner: macos-14

    steps:
      - name: Check out the immutable tag commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.release-ref-gate.outputs.release_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Require detached, clean event commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release-ref-gate.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "Artifact verification must run from a detached commit." >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"

      - name: Build artifacts and verify the installed wheel test suite
        shell: bash
        env:
          CHAIN_ROOT: ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
          CARGO_HOME: ${{ runner.temp }}/pyfgsea-cargo-home-${{ matrix.key }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"expected Python 3.11, found {sys.version}")
          PY
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          python -m pip install --disable-pip-version-check "maturin==$MATURIN_VERSION"
          test "$(python -m maturin --version | awk '{print $2}')" = "$MATURIN_VERSION"
          commit="$(git rev-parse HEAD)"
          python scripts/verify_pyfgsea_artifacts.py \
            --repo "$GITHUB_WORKSPACE" \
            --commit "$commit" \
            --release-tag "$RELEASE_TAG" \
            --output-dir "$CHAIN_ROOT/dist" \
            --venv "$CHAIN_ROOT/venv" \
            --work-dir "$CHAIN_ROOT/work" \
            --receipt "$CHAIN_ROOT/evidence/receipt.json"

      - name: Record platform artifact provenance
        continue-on-error: true
        shell: bash
        env:
          CHAIN_ROOT: ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHAIN_ROOT"])
          files = sorted(
              path for directory in (root / "dist", root / "evidence")
              for path in directory.iterdir()
              if path.is_file() and path.name != "bundle-provenance.json"
          )
          records = {
              path.relative_to(root).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in files
          }
          payload = {
              "schema_version": 1,
              "kind": "artifact-provenance",
              "platform_key": os.environ["PLATFORM_KEY"],
              "sha256_role": "provenance_only",
              "hashes_are_pass_fail_checks": False,
              "files": records,
          }
          (root / "evidence" / "bundle-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload artifacts and run records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-artifact-chain-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}/dist/*
            ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}/evidence/*
          if-no-files-found: error
          retention-days: 30

  reference-oci:
    name: Build reference images (${{ matrix.profile }})
    needs: release-ref-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy-publication
            dockerfile: Dockerfile.reference-fgsea-1.32.2
            reference_id: legacy-publication
            r_version: "4.4.3"
            bioc_version: "3.20"
            fgsea_version: "1.32.2"
            base_digest: sha256:089317f336a61255bb35f1efd799820cef37136d2acf2a76ba4abb74af51d4a3
          - profile: current-conformance
            dockerfile: Dockerfile.reference-fgsea-1.38.0
            reference_id: current-conformance
            r_version: "4.6.0"
            bioc_version: "3.23"
            fgsea_version: "1.38.0"
            base_digest: sha256:dc3c818ba1a6a58cbc5c450878bb4d9a6385feef60bbbfa5f8d62e54f544e566

    steps:
      - name: Check out the immutable event commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.release-ref-gate.outputs.release_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Require detached, clean event commit
        env:
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "Reference verification must run from a detached commit." >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up an isolated Buildx builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Install the OCI import tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version

      - name: Build the reference image and export its OCI archive
        env:
          PROFILE: ${{ matrix.profile }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OCI_ROOT: ${{ runner.temp }}/reference-${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$OCI_ROOT"
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --metadata-file "$OCI_ROOT/build-metadata.json" \
            --output "type=oci,dest=$OCI_ROOT/$PROFILE.oci.tar" \
            "$GITHUB_WORKSPACE"

      - name: Start the image and verify the R reference environment
        env:
          PROFILE: ${{ matrix.profile }}
          REFERENCE_ID: ${{ matrix.reference_id }}
          EXPECTED_R: ${{ matrix.r_version }}
          EXPECTED_BIOC: ${{ matrix.bioc_version }}
          EXPECTED_FGSEA: ${{ matrix.fgsea_version }}
          OCI_ROOT: ${{ runner.temp }}/reference-${{ matrix.profile }}
        run: |
          set -euo pipefail
          archive="$OCI_ROOT/$PROFILE.oci.tar"
          image_ref="pyfgsea-reference:$PROFILE"
          mkdir -p "$OCI_ROOT/evidence"
          skopeo --insecure-policy copy \
            "oci-archive:$archive" \
            "docker-daemon:$image_ref"
          docker run --rm --platform linux/amd64 "$image_ref" \
            | tee "$OCI_ROOT/evidence/reference-verification.txt"
          grep -Fx "REFERENCE_ID=$REFERENCE_ID" "$OCI_ROOT/evidence/reference-verification.txt"
          grep -Fx "R_VERSION=$EXPECTED_R" "$OCI_ROOT/evidence/reference-verification.txt"
          grep -Fx "BIOCONDUCTOR_VERSION=$EXPECTED_BIOC" "$OCI_ROOT/evidence/reference-verification.txt"
          grep -Fx "FGSEA_VERSION=$EXPECTED_FGSEA" "$OCI_ROOT/evidence/reference-verification.txt"
          docker run --rm --platform linux/amd64 --entrypoint Rscript "$image_ref" \
            -e 'library(fgsea); sessionInfo()' \
            > "$OCI_ROOT/evidence/R-sessionInfo.txt"
          grep -F "R version $EXPECTED_R" "$OCI_ROOT/evidence/R-sessionInfo.txt"
          grep -F "fgsea_$EXPECTED_FGSEA" "$OCI_ROOT/evidence/R-sessionInfo.txt"

      - name: Record reference image provenance
        continue-on-error: true
        env:
          PROFILE: ${{ matrix.profile }}
          REFERENCE_ID: ${{ matrix.reference_id }}
          EXPECTED_R: ${{ matrix.r_version }}
          EXPECTED_BIOC: ${{ matrix.bioc_version }}
          EXPECTED_FGSEA: ${{ matrix.fgsea_version }}
          EXPECTED_BASE_DIGEST: ${{ matrix.base_digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OCI_ROOT: ${{ runner.temp }}/reference-${{ matrix.profile }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
          RELEASE_TAG_OBJECT: ${{ needs.release-ref-gate.outputs.release_tag_object }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          root = Path(os.environ["OCI_ROOT"])
          archive = root / f"{os.environ['PROFILE']}.oci.tar"
          metadata = json.loads((root / "build-metadata.json").read_text(encoding="utf-8"))
          verification_path = root / "evidence" / "reference-verification.txt"
          session_path = root / "evidence" / "R-sessionInfo.txt"
          payload = {
              "schema_version": 2,
              "kind": "reference-image-run",
              "status": "passed",
              "profile": os.environ["PROFILE"],
              "git_commit": os.environ["COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "release_tag_object": os.environ["RELEASE_TAG_OBJECT"],
              "platform": "linux/amd64",
              "dockerfile": os.environ["DOCKERFILE"],
              "base_image_digest": os.environ["EXPECTED_BASE_DIGEST"],
              "built_image_digest": metadata.get("containerimage.digest"),
              "runtime": {
                  "reference_id": os.environ["REFERENCE_ID"],
                  "r_version": os.environ["EXPECTED_R"],
                  "bioconductor_version": os.environ["EXPECTED_BIOC"],
                  "fgsea_version": os.environ["EXPECTED_FGSEA"],
                  "container_started": True,
                  "reference_script_passed": True,
                  "session_info_captured": True,
              },
              "provenance": {
                  "sha256_role": "provenance_only",
                  "hashes_are_pass_fail_checks": False,
                  "oci_archive": {
                      "filename": archive.name,
                      "bytes": archive.stat().st_size,
                      "sha256": sha256_file(archive),
                  },
                  "reference_verification_sha256": hashlib.sha256(
                      verification_path.read_bytes()
                  ).hexdigest(),
                  "session_info_sha256": hashlib.sha256(
                      session_path.read_bytes()
                  ).hexdigest(),
              },
              "build_metadata": metadata,
              "registry_push_performed": False,
          }
          (root / "evidence" / "oci-receipt.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the reference run record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-reference-${{ matrix.profile }}-receipt
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/reference-${{ matrix.profile }}/build-metadata.json
            ${{ runner.temp }}/reference-${{ matrix.profile }}/evidence/**

      - name: Upload the OCI archive without recompression
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-reference-${{ matrix.profile }}-oci
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/reference-${{ matrix.profile }}/${{ matrix.profile }}.oci.tar

  cross-platform-gate:
    name: Summarize release checks
    if: ${{ always() }}
    needs: [artifact-chain, reference-oci]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform chain to pass
        shell: bash
        env:
          ARTIFACT_CHAIN_RESULT: ${{ needs.artifact-chain.result }}
          REFERENCE_OCI_RESULT: ${{ needs.reference-oci.result }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_CHAIN_RESULT" = "success"
          test "$REFERENCE_OCI_RESULT" = "success"
