name: PyFgsea 0.2.0 artifact and reference OCI verification

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.2.0-rc*"
      - "v0.2.0"

# This workflow is evidence-only.  It has no package/release/registry write
# permission and contains no publication or registry-login step.
permissions:
  contents: read

concurrency:
  group: pyfgsea-0.2.0-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "1.92.0"
  MATURIN_VERSION: "1.10.2"
  PYTEST_VERSION: "8.4.2"
  EXPECTED_PYFGSEA_VERSION: "0.2.0"
  EXPECTED_ALGORITHM_REVISION: "fgsea-1.38-pr178-v1"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "60"

jobs:
  release-ref-gate:
    name: Require an annotated 0.2.0 release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      release_tag_object: ${{ steps.verify.outputs.release_tag_object }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
      release_tree: ${{ steps.verify.outputs.release_tree }}
    steps:
      - name: Check out the event ref with tag objects and no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the annotated tag and peeled event commit
        id: verify
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_REF_TYPE" != "tag" ]]; then
            echo "Artifact evidence may only be produced from a tag ref, not $EVENT_REF." >&2
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v0\.2\.0(-rc[1-9][0-9]*)?$ ]]; then
            echo "Unexpected release tag: $EVENT_REF_NAME" >&2
            exit 1
          fi
          tag_ref="refs/tags/$EVENT_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          peeled="$(git rev-parse "$tag_ref^{commit}")"
          test "$peeled" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "release_tag=$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag_object=$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"
          echo "release_commit=$peeled" >> "$GITHUB_OUTPUT"
          echo "release_tree=$(git rev-parse "$peeled^{tree}")" >> "$GITHUB_OUTPUT"

  artifact-chain:
    name: Artifact chain (${{ matrix.key }})
    needs: release-ref-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-24.04
          - key: windows-x86_64
            runner: windows-2022
          - key: macos
            runner: macos-14

    steps:
      - name: Check out the immutable event commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.release-ref-gate.outputs.release_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Require detached, clean event commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "Release verification must run from a detached commit." >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust 1.92.0
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install and verify the pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"expected Python 3.11, found {sys.version}")
          PY
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          python -m pip install --disable-pip-version-check "maturin==$MATURIN_VERSION"
          python - <<'PY'
          import importlib.metadata
          import os
          observed = importlib.metadata.version("maturin")
          expected = os.environ["MATURIN_VERSION"]
          if observed != expected:
              raise SystemExit(f"expected maturin {expected}, found {observed}")
          PY

      - name: Build sdist, build wheel only from that sdist, and verify clean install
        shell: bash
        env:
          CHAIN_ROOT: ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python scripts/verify_pyfgsea_artifacts.py \
            --repo "$GITHUB_WORKSPACE" \
            --commit "$commit" \
            --release-tag "$RELEASE_TAG" \
            --output-dir "$CHAIN_ROOT/dist" \
            --venv "$CHAIN_ROOT/venv" \
            --work-dir "$CHAIN_ROOT/work" \
            --receipt "$CHAIN_ROOT/evidence/receipt.json" \
            --expected-version "$EXPECTED_PYFGSEA_VERSION" \
            --expected-algorithm-revision "$EXPECTED_ALGORITHM_REVISION"

      - name: Run the critical suite against only the installed wheel
        shell: bash
        env:
          CHAIN_ROOT: ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          chain_root = Path(os.environ["CHAIN_ROOT"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          venv_python = chain_root / "venv" / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          test_files = [
              workspace / "tests/test_upstream_issue_151.py",
              workspace / "tests/test_multilevel_ties.py",
              workspace / "tests/test_score_types.py",
              workspace / "tests/test_rng_invariance.py",
              workspace / "tests/test_pvalue_error.py",
              workspace / "tests/test_failure_states.py",
              workspace / "tests/test_trajectory_nes.py",
              workspace / "tests/test_reference_fgsea.py",
          ]
          if not venv_python.is_file() or any(not path.is_file() for path in test_files):
              raise SystemExit("installed-wheel test inputs are incomplete")

          # The exact R/fgsea environment contract is checked fail-closed inside
          # the current-conformance OCI job. Cross-platform wheel runners execute
          # the manifest test explicitly instead of silently skipping the numeric
          # Python-vs-R subprocess test on hosts without that R installation. The
          # dual-lane Figure 1 workflow remains the numeric cross-reference gate.
          reference_file = workspace / "tests/test_reference_fgsea.py"
          test_nodes = [
              *map(str, test_files[:-1]),
              f"{reference_file}::test_reference_manifest_freezes_legacy_and_current_lanes",
          ]

          subprocess.run(
              [
                  str(venv_python), "-m", "pip", "install",
                  "--disable-pip-version-check", "--no-input",
                  f"pytest=={os.environ['PYTEST_VERSION']}",
              ],
              cwd=os.environ["RUNNER_TEMP"],
              check=True,
          )
          junit = chain_root / "evidence" / "installed-tests.junit.xml"
          command = [
              str(venv_python), "-I", "-m", "pytest", "-q",
              "--import-mode=importlib", f"--junitxml={junit}",
              *test_nodes,
          ]
          env = os.environ.copy()
          env.pop("PYTHONPATH", None)
          env.pop("PYTHONHOME", None)
          env["PYTHONNOUSERSITE"] = "1"
          subprocess.run(command, cwd=os.environ["RUNNER_TEMP"], env=env, check=True)
          if not junit.is_file():
              raise SystemExit("pytest passed without producing the required JUnit evidence")

          files = {}
          for path in test_files:
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          contract = {
              "schema_version": 1,
              "status": "passed",
              "platform_key": os.environ["PLATFORM_KEY"],
              "pytest_version": os.environ["PYTEST_VERSION"],
              "cwd_outside_checkout": os.environ["RUNNER_TEMP"],
              "isolated_python": True,
              "import_mode": "importlib",
              "selected_test_nodes": test_nodes,
              "r_fgsea_subprocess_test_run": False,
              "r_fgsea_subprocess_test_gate": "separate dual-lane numeric comparison",
              "test_source_sha256": files,
              "command": command,
          }
          (chain_root / "evidence" / "installed-test-contract.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Hash the platform evidence bundle
        shell: bash
        env:
          CHAIN_ROOT: ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHAIN_ROOT"])
          evidence = root / "evidence"
          receipt = evidence / "receipt.json"
          artifacts = sorted((root / "dist").iterdir())
          if not receipt.is_file():
              raise SystemExit("the fail-closed verifier did not emit a receipt")
          if len([p for p in artifacts if p.name.endswith(".tar.gz")]) != 1:
              raise SystemExit("expected exactly one sdist")
          if len([p for p in artifacts if p.suffix == ".whl"]) != 1:
              raise SystemExit("expected exactly one wheel")

          evidence_files = sorted(
              path for path in evidence.iterdir()
              if path.is_file() and path.name != "bundle-sha256.json"
          )
          files = [*evidence_files, *artifacts]
          records = {}
          for path in files:
              if not path.is_file():
                  raise SystemExit(f"unexpected non-file artifact: {path}")
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              records[path.relative_to(root).as_posix()] = {
                  "bytes": path.stat().st_size,
                  "sha256": digest.hexdigest(),
              }
          payload = {
              "schema_version": 1,
              "status": "passed",
              "platform_key": os.environ["PLATFORM_KEY"],
              "files": records,
          }
          (evidence / "bundle-sha256.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the verified platform chain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-chain-${{ matrix.key }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}/dist/
            ${{ runner.temp }}/pyfgsea-chain-${{ matrix.key }}/evidence/

  artifact-chain-summary:
    name: Cross-platform artifact-chain gate
    needs:
      - release-ref-gate
      - artifact-chain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download all independently verified chains
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pyfgsea-chain-*
          path: ${{ runner.temp }}/pyfgsea-chains

      - name: Require one source identity across every platform
        env:
          CHAINS_ROOT: ${{ runner.temp }}/pyfgsea-chains
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
          RELEASE_TAG_OBJECT: ${{ needs.release-ref-gate.outputs.release_tag_object }}
          SUMMARY_PATH: ${{ runner.temp }}/pyfgsea-chain-summary.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHAINS_ROOT"])
          receipts = sorted(root.glob("pyfgsea-chain-*/evidence/receipt.json"))
          if len(receipts) != 3:
              raise SystemExit(f"expected three platform receipts, found {len(receipts)}")

          parsed = [(path.parents[1].name, json.loads(path.read_text(encoding="utf-8"))) for path in receipts]
          first = parsed[0][1]
          expected_commit = os.environ["EXPECTED_COMMIT"].lower()
          release_tag = os.environ["RELEASE_TAG"]
          release_tag_object = os.environ["RELEASE_TAG_OBJECT"].lower()
          expected_tree = first["git"]["tree"]
          expected_sources = first["git"]["source_manifest"]
          expected_source_digest = first["artifact_chain"]["sdist"]["verified_source_manifest_sha256"]
          summary = {
              "schema_version": 1,
              "status": "passed",
              "commit": expected_commit,
              "tree": expected_tree,
              "release_tag": release_tag,
              "release_tag_object": release_tag_object,
              "source_manifest_sha256": expected_source_digest,
              "chains": {},
              "note": (
                  "The fail-closed verifier owns sdist creation, so each platform creates one sdist "
                  "from the identical commit and proves exact Git-source equivalence before building "
                  "its wheel. Cross-platform tar.gz bytes are not assumed reproducible."
              ),
          }

          for name, receipt in parsed:
              if receipt.get("status") != "passed" or receipt.get("all_release_gates_passed") is not True:
                  raise SystemExit(f"{name}: verifier did not pass all gates")
              if receipt.get("expected") != {
                  "pyfgsea_version": os.environ["EXPECTED_PYFGSEA_VERSION"],
                  "algorithm_revision": os.environ["EXPECTED_ALGORITHM_REVISION"],
              }:
                  raise SystemExit(f"{name}: expected version/revision contract mismatch")
              git = receipt["git"]
              chain = receipt["artifact_chain"]
              if git["commit"].lower() != expected_commit:
                  raise SystemExit(f"{name}: commit mismatch")
              if git["tree"] != expected_tree:
                  raise SystemExit(f"{name}: tree mismatch")
              if git.get("release_tag") != {
                  "name": release_tag,
                  "annotated": True,
                  "tag_object": release_tag_object,
                  "peeled_commit": expected_commit,
              }:
                  raise SystemExit(f"{name}: annotated release-tag binding mismatch")
              if git["source_manifest"] != expected_sources:
                  raise SystemExit(f"{name}: per-file Git source manifest mismatch")
              if chain["sdist"]["verified_source_manifest_sha256"] != expected_source_digest:
                  raise SystemExit(f"{name}: sdist source-manifest mismatch")
              if chain["wheel"]["build_input_sdist_sha256"] != chain["sdist"]["sha256"]:
                  raise SystemExit(f"{name}: wheel is not bound to its verified sdist")
              if chain["wheel"].get("wheel_built_from_verified_sdist") is not True:
                  raise SystemExit(f"{name}: missing wheel-from-sdist proof")
              if chain["installed"]["direct_url_wheel_sha256"] != chain["wheel"]["sha256"]:
                  raise SystemExit(f"{name}: installed wheel hash mismatch")
              artifact_root = next(path.parents[1] for path in receipts if path.parents[1].name == name)
              test_contract = json.loads(
                  (artifact_root / "evidence" / "installed-test-contract.json").read_text(encoding="utf-8")
              )
              expected_platform_key = name.removeprefix("pyfgsea-chain-")
              if test_contract.get("status") != "passed" or test_contract.get("platform_key") != expected_platform_key:
                  raise SystemExit(f"{name}: installed-wheel critical test contract mismatch")
              bundle = json.loads(
                  (artifact_root / "evidence" / "bundle-sha256.json").read_text(encoding="utf-8")
              )
              if bundle.get("status") != "passed" or bundle.get("platform_key") != expected_platform_key:
                  raise SystemExit(f"{name}: evidence bundle contract mismatch")
              for relative, record in bundle["files"].items():
                  file_path = artifact_root.joinpath(*relative.split("/"))
                  if not file_path.is_file():
                      raise SystemExit(f"{name}: evidence bundle lacks {relative}")
                  actual = hashlib.sha256(file_path.read_bytes()).hexdigest()
                  if actual != record["sha256"] or file_path.stat().st_size != record["bytes"]:
                      raise SystemExit(f"{name}: downloaded evidence hash mismatch for {relative}")
              summary["chains"][name] = {
                  "sdist_filename": chain["sdist"]["filename"],
                  "sdist_sha256": chain["sdist"]["sha256"],
                  "wheel_filename": chain["wheel"]["filename"],
                  "wheel_sha256": chain["wheel"]["sha256"],
                  "native_core_sha256": chain["wheel"]["core_sha256"],
                  "installed_tests": {
                      "pytest_version": test_contract["pytest_version"],
                      "test_source_sha256": test_contract["test_source_sha256"],
                      "junit_sha256": bundle["files"]["evidence/installed-tests.junit.xml"]["sha256"],
                  },
              }

          wheel_names = {item["wheel_filename"] for item in summary["chains"].values()}
          if len(wheel_names) != 3:
              raise SystemExit(f"expected three platform-specific wheel filenames, found {sorted(wheel_names)}")

          Path(os.environ["SUMMARY_PATH"]).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the cross-platform gate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-chain-cross-platform-summary
          path: ${{ runner.temp }}/pyfgsea-chain-summary.json
          if-no-files-found: error
          retention-days: 30

  reference-oci:
    name: Reference OCI (${{ matrix.profile }})
    needs: release-ref-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy-publication
            dockerfile: Dockerfile.reference-fgsea-1.32.2
            reference_id: legacy-publication
            r_version: "4.4.3"
            bioc_version: "3.20"
            fgsea_version: "1.32.2"
            base_digest: sha256:089317f336a61255bb35f1efd799820cef37136d2acf2a76ba4abb74af51d4a3
          - profile: current-conformance
            dockerfile: Dockerfile.reference-fgsea-1.38.0
            reference_id: current-conformance
            r_version: "4.6.0"
            bioc_version: "3.23"
            fgsea_version: "1.38.0"
            base_digest: sha256:dc3c818ba1a6a58cbc5c450878bb4d9a6385feef60bbbfa5f8d62e54f544e566

    steps:
      - name: Check out the immutable event commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.release-ref-gate.outputs.release_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Require detached, clean event commit
        env:
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "Reference verification must run from a detached commit." >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up an isolated Buildx builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build without cache and export OCI layout only
        env:
          PROFILE: ${{ matrix.profile }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OCI_ROOT: ${{ runner.temp }}/reference-${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$OCI_ROOT"
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --metadata-file "$OCI_ROOT/build-metadata.json" \
            --output "type=oci,dest=$OCI_ROOT/$PROFILE.oci.tar" \
            "$GITHUB_WORKSPACE"

      - name: Inspect OCI structure and extract reference evidence
        env:
          PROFILE: ${{ matrix.profile }}
          REFERENCE_ID: ${{ matrix.reference_id }}
          EXPECTED_R: ${{ matrix.r_version }}
          EXPECTED_BIOC: ${{ matrix.bioc_version }}
          EXPECTED_FGSEA: ${{ matrix.fgsea_version }}
          EXPECTED_BASE_DIGEST: ${{ matrix.base_digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OCI_ROOT: ${{ runner.temp }}/reference-${{ matrix.profile }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
          RELEASE_TAG_OBJECT: ${{ needs.release-ref-gate.outputs.release_tag_object }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def safe_parts(name, context):
              if "\\" in name:
                  raise RuntimeError(f"{context} uses a backslash path: {name!r}")
              path = PurePosixPath(name)
              if path.is_absolute() or any(part in ("", ".", "..") for part in path.parts):
                  raise RuntimeError(f"unsafe {context} path: {name!r}")
              return path.parts

          root = Path(os.environ["OCI_ROOT"])
          archive = root / f"{os.environ['PROFILE']}.oci.tar"
          layout = root / "oci-layout-expanded"
          evidence = root / "evidence" / "opt" / "reference"
          layout.mkdir(parents=True, exist_ok=False)

          # Extract the OCI layout with explicit path/type checks.
          with tarfile.open(archive, "r:*") as outer:
              for member in outer:
                  parts = safe_parts(member.name, "OCI archive member")
                  target = layout.joinpath(*parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = outer.extractfile(member)
                      if source is None:
                          raise RuntimeError(f"cannot read OCI member {member.name!r}")
                      with source, target.open("wb") as sink:
                          shutil.copyfileobj(source, sink)
                  else:
                      raise RuntimeError(f"unsupported OCI member type: {member.name!r}")

          index_path = layout / "index.json"
          index_bytes = index_path.read_bytes()
          index = json.loads(index_bytes)
          descriptors = index.get("manifests", [])
          if len(descriptors) != 1:
              raise RuntimeError(f"expected one OCI index descriptor, found {len(descriptors)}")

          def blob_for(digest):
              algorithm, separator, value = digest.partition(":")
              if separator != ":" or algorithm != "sha256" or not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise RuntimeError(f"unsupported OCI digest: {digest!r}")
              path = layout / "blobs" / algorithm / value
              if not path.is_file() or sha256_file(path) != value:
                  raise RuntimeError(f"missing or corrupt OCI blob: {digest}")
              return path

          descriptor = descriptors[0]
          descriptor_platform = descriptor.get("platform", {})
          if descriptor_platform and (
              descriptor_platform.get("os") != "linux" or descriptor_platform.get("architecture") != "amd64"
          ):
              raise RuntimeError(f"unexpected OCI platform: {descriptor_platform}")
          manifest_path = blob_for(descriptor["digest"])
          manifest = json.loads(manifest_path.read_bytes())
          if "manifests" in manifest:
              nested = [
                  item for item in manifest["manifests"]
                  if item.get("platform", {}).get("os") == "linux"
                  and item.get("platform", {}).get("architecture") == "amd64"
              ]
              if len(nested) != 1:
                  raise RuntimeError(f"expected one linux/amd64 nested manifest, found {len(nested)}")
              descriptor = nested[0]
              manifest_path = blob_for(descriptor["digest"])
              manifest = json.loads(manifest_path.read_bytes())
          if "layers" not in manifest or "config" not in manifest:
              raise RuntimeError("OCI descriptor does not resolve to an image manifest")

          config_path = blob_for(manifest["config"]["digest"])
          config = json.loads(config_path.read_bytes())
          env = {}
          for item in config.get("config", {}).get("Env", []):
              key, separator, value = item.partition("=")
              if separator:
                  env[key] = value
          expected_env = {
              "FGSEA_REFERENCE_ID": os.environ["REFERENCE_ID"],
              "FGSEA_REFERENCE_R_VERSION": os.environ["EXPECTED_R"],
              "FGSEA_REFERENCE_BIOC_VERSION": os.environ["EXPECTED_BIOC"],
              "FGSEA_REFERENCE_VERSION": os.environ["EXPECTED_FGSEA"],
          }
          for key, value in expected_env.items():
              if env.get(key) != value:
                  raise RuntimeError(f"image config {key}={env.get(key)!r}, expected {value!r}")

          # Reconstruct the final /opt/reference view from ordered OCI layers.
          state = {}
          reference_root = PurePosixPath("opt/reference")
          for layer in manifest["layers"]:
              layer_path = blob_for(layer["digest"])
              with tarfile.open(layer_path, "r:*") as layer_tar:
                  for member in layer_tar:
                      raw = member.name[2:] if member.name.startswith("./") else member.name
                      parts = safe_parts(raw, "layer member")
                      path = PurePosixPath(*parts)
                      basename = path.name
                      if basename == ".wh..wh..opq":
                          parent = path.parent
                          if parent == reference_root or reference_root.is_relative_to(parent):
                              state.clear()
                          elif parent.is_relative_to(reference_root):
                              prefix = parent.relative_to(reference_root).as_posix().rstrip("/") + "/"
                              state = {key: value for key, value in state.items() if not key.startswith(prefix)}
                          continue
                      if basename.startswith(".wh."):
                          target = path.parent / basename[4:]
                          if target == reference_root or reference_root.is_relative_to(target):
                              state.clear()
                          elif target.is_relative_to(reference_root):
                              relative = target.relative_to(reference_root).as_posix()
                              state = {
                                  key: value for key, value in state.items()
                                  if key != relative and not key.startswith(relative.rstrip("/") + "/")
                              }
                          continue
                      if not path.is_relative_to(reference_root) or path == reference_root:
                          continue
                      relative = path.relative_to(reference_root).as_posix()
                      if member.isdir():
                          continue
                      if not member.isfile():
                          raise RuntimeError(f"non-regular /opt/reference member: {path}")
                      source = layer_tar.extractfile(member)
                      if source is None:
                          raise RuntimeError(f"cannot read layer member {path}")
                      state[relative] = source.read()

          required = {
              "fgsea.tar.gz",
              "renv.resolved.lock",
              "reference-verification.txt",
              "R-sessionInfo.txt",
              "dpkg-packages.tsv",
              "evidence-sha256.txt",
          }
          missing = sorted(required - state.keys())
          if missing:
              raise RuntimeError(f"OCI image lacks reference evidence: {missing}")
          for relative, data in state.items():
              target = evidence.joinpath(*PurePosixPath(relative).parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          verification = {}
          for line in (evidence / "reference-verification.txt").read_text(encoding="utf-8").splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  verification[key] = value
          expected_verification = {
              "REFERENCE_ID": os.environ["REFERENCE_ID"],
              "R_VERSION": os.environ["EXPECTED_R"],
              "BIOCONDUCTOR_VERSION": os.environ["EXPECTED_BIOC"],
              "FGSEA_VERSION": os.environ["EXPECTED_FGSEA"],
          }
          for key, value in expected_verification.items():
              if verification.get(key) != value:
                  raise RuntimeError(f"reference verification {key}={verification.get(key)!r}, expected {value!r}")

          recorded_hashes = {}
          for line in (evidence / "evidence-sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, separator, raw_path = line.partition("  ")
              if not separator or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise RuntimeError(f"invalid evidence hash line: {line!r}")
              recorded_hashes[PurePosixPath(raw_path).name] = digest
          for filename in ("fgsea.tar.gz", "renv.resolved.lock"):
              actual = sha256_file(evidence / filename)
              if recorded_hashes.get(filename) != actual:
                  raise RuntimeError(f"recorded hash mismatch for {filename}")

          dockerfile = Path(os.environ["DOCKERFILE"])
          dockerfile_text = dockerfile.read_text(encoding="utf-8")
          expected_from = f"@{os.environ['EXPECTED_BASE_DIGEST']}"
          first_instruction = next(
              line.strip() for line in dockerfile_text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          if not first_instruction.startswith("FROM ") or expected_from not in first_instruction:
              raise RuntimeError("Dockerfile does not use the declared pinned base digest")

          metadata_path = root / "build-metadata.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata_digest = metadata.get("containerimage.digest")
          digest_candidates = {
              descriptor["digest"],
              "sha256:" + sha256_file(index_path),
              "sha256:" + sha256_file(manifest_path),
          }
          if metadata_digest not in digest_candidates:
              raise RuntimeError(
                  f"Buildx image digest {metadata_digest!r} does not match inspected OCI descriptors {sorted(digest_candidates)}"
              )

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          observed_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=workspace, text=True
          ).strip().lower()
          if observed_commit != os.environ["COMMIT"].lower():
              raise RuntimeError(f"checkout commit changed during OCI build: {observed_commit}")
          tag_ref = f"refs/tags/{os.environ['RELEASE_TAG']}"
          observed_tag_type = subprocess.check_output(
              ["git", "cat-file", "-t", tag_ref], cwd=workspace, text=True
          ).strip()
          observed_tag_object = subprocess.check_output(
              ["git", "rev-parse", tag_ref], cwd=workspace, text=True
          ).strip().lower()
          observed_tag_commit = subprocess.check_output(
              ["git", "rev-parse", f"{tag_ref}^{{commit}}"], cwd=workspace, text=True
          ).strip().lower()
          if observed_tag_type != "tag":
              raise RuntimeError("release ref is not an annotated tag object")
          if observed_tag_object != os.environ["RELEASE_TAG_OBJECT"].lower():
              raise RuntimeError("release tag object changed during OCI build")
          if observed_tag_commit != observed_commit:
              raise RuntimeError("release tag no longer peels to the OCI source commit")
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              cwd=workspace,
              text=True,
          )
          if status:
              raise RuntimeError("checkout became dirty during OCI build")
          git_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], cwd=workspace, text=True
          ).strip().lower()
          docker_version = subprocess.check_output(
              ["docker", "version", "--format", "{{.Client.Version}}"], text=True
          ).strip()
          buildx_version = subprocess.check_output(
              ["docker", "buildx", "version"], text=True
          ).strip()

          evidence_files = {}
          for path in sorted(evidence.rglob("*")):
              if path.is_file():
                  evidence_files[path.relative_to(evidence).as_posix()] = {
                      "bytes": path.stat().st_size,
                      "sha256": sha256_file(path),
                  }
          receipt = {
              "schema_version": 1,
              "status": "passed",
              "profile": os.environ["PROFILE"],
              "git_commit": observed_commit,
              "git_tree": git_tree,
              "release_tag": os.environ["RELEASE_TAG"],
              "release_tag_object": observed_tag_object,
              "platform": "linux/amd64",
              "dockerfile": os.environ["DOCKERFILE"],
              "dockerfile_sha256": sha256_file(dockerfile),
              "base_image_digest": os.environ["EXPECTED_BASE_DIGEST"],
              "built_image_digest": metadata_digest,
              "oci_manifest_digest": descriptor["digest"],
              "oci_index_sha256": sha256_file(index_path),
              "oci_archive": {
                  "filename": archive.name,
                  "bytes": archive.stat().st_size,
                  "sha256": sha256_file(archive),
              },
              "reference_verification": verification,
              "evidence_files": evidence_files,
              "build_metadata": metadata,
              "tool_versions": {
                  "docker_client": docker_version,
                  "docker_buildx": buildx_version,
              },
              "build_command": [
                  "docker", "buildx", "build",
                  "--builder", "${{ steps.buildx.outputs.name }}",
                  "--file", os.environ["DOCKERFILE"],
                  "--platform", "linux/amd64",
                  "--pull", "--no-cache", "--provenance=false", "--sbom=false",
                  "--metadata-file", str(root / "build-metadata.json"),
                  "--output", f"type=oci,dest={archive}",
                  os.environ["GITHUB_WORKSPACE"],
              ],
              "registry_push_performed": False,
          }
          receipt_path = root / "evidence" / "oci-receipt.json"
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload the OCI evidence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-reference-${{ matrix.profile }}-receipt
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/reference-${{ matrix.profile }}/build-metadata.json
            ${{ runner.temp }}/reference-${{ matrix.profile }}/evidence/**

      - name: Upload the OCI archive without recompression
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-reference-${{ matrix.profile }}-oci
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/reference-${{ matrix.profile }}/${{ matrix.profile }}.oci.tar

  reference-oci-summary:
    name: Reference OCI cross-profile gate
    needs:
      - release-ref-gate
      - artifact-chain-summary
      - reference-oci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download reference receipts only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pyfgsea-reference-*-receipt
          path: ${{ runner.temp }}/reference-receipts

      - name: Download the verified PyFgsea artifact-chain binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyfgsea-chain-cross-platform-summary
          path: ${{ runner.temp }}/pyfgsea-chain-binding

      - name: Require both immutable reference profiles
        env:
          RECEIPTS_ROOT: ${{ runner.temp }}/reference-receipts
          ARTIFACT_CHAIN_SUMMARY: ${{ runner.temp }}/pyfgsea-chain-binding/pyfgsea-chain-summary.json
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-ref-gate.outputs.release_tag }}
          RELEASE_TAG_OBJECT: ${{ needs.release-ref-gate.outputs.release_tag_object }}
          SUMMARY_PATH: ${{ runner.temp }}/reference-oci-summary.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RECEIPTS_ROOT"])
          paths = sorted(root.glob("pyfgsea-reference-*-receipt/evidence/oci-receipt.json"))
          if len(paths) != 2:
              raise SystemExit(f"expected two reference receipts, found {len(paths)}")
          expected_profiles = {"legacy-publication", "current-conformance"}
          expected_commit = os.environ["EXPECTED_COMMIT"].lower()
          release_tag = os.environ["RELEASE_TAG"]
          release_tag_object = os.environ["RELEASE_TAG_OBJECT"].lower()
          artifact_chain = json.loads(
              Path(os.environ["ARTIFACT_CHAIN_SUMMARY"]).read_text(encoding="utf-8")
          )
          if artifact_chain.get("status") != "passed":
              raise SystemExit("PyFgsea cross-platform artifact chain did not pass")
          if artifact_chain.get("commit") != expected_commit:
              raise SystemExit("PyFgsea artifact chain and reference OCI commit differ")
          if artifact_chain.get("release_tag") != release_tag:
              raise SystemExit("PyFgsea artifact chain release tag mismatch")
          if artifact_chain.get("release_tag_object") != release_tag_object:
              raise SystemExit("PyFgsea artifact chain tag object mismatch")
          receipts = {}
          for path in paths:
              receipt = json.loads(path.read_text(encoding="utf-8"))
              profile = receipt.get("profile")
              if profile in receipts or profile not in expected_profiles:
                  raise SystemExit(f"unexpected or duplicate profile: {profile!r}")
              if receipt.get("status") != "passed":
                  raise SystemExit(f"{profile}: OCI receipt did not pass")
              if receipt.get("git_commit") != expected_commit:
                  raise SystemExit(f"{profile}: commit mismatch")
              if receipt.get("release_tag") != release_tag:
                  raise SystemExit(f"{profile}: release tag mismatch")
              if receipt.get("release_tag_object") != release_tag_object:
                  raise SystemExit(f"{profile}: release tag object mismatch")
              if receipt.get("platform") != "linux/amd64":
                  raise SystemExit(f"{profile}: platform mismatch")
              if receipt.get("registry_push_performed") is not False:
                  raise SystemExit(f"{profile}: receipt does not assert no registry push")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", receipt.get("built_image_digest", "")):
                  raise SystemExit(f"{profile}: invalid built image digest")
              receipts[profile] = receipt
          if set(receipts) != expected_profiles:
              raise SystemExit(f"reference profile set mismatch: {set(receipts)}")

          summary = {
              "schema_version": 1,
              "status": "passed",
              "git_commit": expected_commit,
              "release_tag": release_tag,
              "release_tag_object": release_tag_object,
              "registry_push_performed": False,
              "pyfgsea_artifact_chain": {
                  "source_manifest_sha256": artifact_chain["source_manifest_sha256"],
                  "chains": artifact_chain["chains"],
              },
              "profiles": {
                  name: {
                      "base_image_digest": item["base_image_digest"],
                      "built_image_digest": item["built_image_digest"],
                      "oci_archive": item["oci_archive"],
                      "reference_verification": item["reference_verification"],
                  }
                  for name, item in sorted(receipts.items())
              },
          }
          Path(os.environ["SUMMARY_PATH"]).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the reference summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-reference-oci-summary
          path: ${{ runner.temp }}/reference-oci-summary.json
          if-no-files-found: error
          retention-days: 30
