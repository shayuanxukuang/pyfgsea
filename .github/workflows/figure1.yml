name: Figure 1 dual-lane rerun

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful PyFgsea release-check run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: figure1-${{ inputs.source_run_id }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "${{ inputs.source_run_id }}"
  PYTHON_VERSION: "3.11.9"
  NUMPY_VERSION: "1.26.4"
  PANDAS_VERSION: "2.2.3"
  SCIPY_VERSION: "1.13.1"
  PSUTIL_VERSION: "6.1.1"
  MATPLOTLIB_VERSION: "3.10.3"
  UV_VERSION: "0.8.17"

jobs:
  figure1-dual-lane:
    name: Run legacy and current Figure 1 lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RESULT_ROOT: /tmp/pyfgsea-figure1-${{ github.run_id }}

    steps:
      - name: Check out the analysis runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v0.2.0
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install comparison dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "numpy==$NUMPY_VERSION" \
            "pandas==$PANDAS_VERSION" \
            "scipy==$SCIPY_VERSION" \
            "psutil==$PSUTIL_VERSION" \
            "matplotlib==$MATPLOTLIB_VERSION" \
            "uv==$UV_VERSION"
          mkdir -p "$RESULT_ROOT/tools"
          cp "$(command -v uv)" "$RESULT_ROOT/tools/uv"
          chmod 0755 "$RESULT_ROOT/tools/uv"
          python --version > "$RESULT_ROOT/comparison-environment.txt"
          python -m pip freeze --all >> "$RESULT_ROOT/comparison-environment.txt"

      - name: Download the current Linux wheel bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyfgsea-artifact-chain-linux-x86_64
          path: ${{ env.RESULT_ROOT }}/current-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the publication reference image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyfgsea-reference-legacy-publication-oci
          path: ${{ env.RESULT_ROOT }}/legacy-oci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the current reference image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyfgsea-reference-current-conformance-oci
          path: ${{ env.RESULT_ROOT }}/current-oci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the published 0.1.4 wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT/legacy-wheel"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          filename = "pyfgsea-0.1.4-cp38-abi3-manylinux_2_34_x86_64.whl"
          with urllib.request.urlopen(
              "https://pypi.org/pypi/pyfgsea/0.1.4/json", timeout=60
          ) as response:
              payload = json.load(response)
          matches = [item for item in payload["urls"] if item["filename"] == filename]
          if len(matches) != 1:
              raise RuntimeError(f"expected one PyPI file named {filename}, found {len(matches)}")
          destination = Path(os.environ["RESULT_ROOT"]) / "legacy-wheel" / filename
          urllib.request.urlretrieve(matches[0]["url"], destination)
          print(destination)
          PY

      - name: Start and verify both R reference images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy \
            "oci-archive:$RESULT_ROOT/legacy-oci/legacy-publication.oci.tar" \
            docker-daemon:pyfgsea-reference-legacy:publication
          skopeo copy \
            "oci-archive:$RESULT_ROOT/current-oci/current-conformance.oci.tar" \
            docker-daemon:pyfgsea-reference-current:current
          docker run --rm pyfgsea-reference-legacy:publication \
            Rscript /opt/reference/verify_fgsea_reference.R
          docker run --rm pyfgsea-reference-current:current \
            Rscript /opt/reference/verify_fgsea_reference.R

      - name: Run PyFgsea 0.1.4 with fgsea 1.32.2
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RESULT_ROOT:/results" \
            --volume "$RESULT_ROOT/tools/uv:/usr/local/bin/uv:ro" \
            --env FGSEA_REFERENCE_VERSION=1.32.2 \
            --env UV_PYTHON_INSTALL_DIR=/results/python \
            --env UV_CACHE_DIR=/results/uv-cache \
            --env UV_PYTHON_PREFERENCE=only-managed \
            pyfgsea-reference-legacy:publication \
            bash -euo pipefail -c '
              uv python install 3.11.9
              uv venv --python 3.11.9 /results/venvs/legacy
              uv pip install --python /results/venvs/legacy/bin/python \
                /results/legacy-wheel/pyfgsea-0.1.4-cp38-abi3-manylinux_2_34_x86_64.whl \
                numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 psutil==6.1.1
              /results/venvs/legacy/bin/python \
                /repo/repro/figure1_dual_lane/run_functional_lane.py \
                --lane legacy \
                --output-dir /results/figure1-legacy
            '

      - name: Run PyFgsea 0.2.0 with fgsea 1.38.0
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RESULT_ROOT:/results" \
            --volume "$RESULT_ROOT/tools/uv:/usr/local/bin/uv:ro" \
            --env FGSEA_REFERENCE_VERSION=1.38.0 \
            --env UV_PYTHON_INSTALL_DIR=/results/python \
            --env UV_CACHE_DIR=/results/uv-cache \
            --env UV_PYTHON_PREFERENCE=only-managed \
            pyfgsea-reference-current:current \
            bash -euo pipefail -c '
              uv venv --python 3.11.9 /results/venvs/current
              uv pip install --python /results/venvs/current/bin/python \
                /results/current-artifact/dist/pyfgsea-0.2.0-cp38-abi3-manylinux_2_34_x86_64.whl \
                numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 psutil==6.1.1
              /results/venvs/current/bin/python \
                /repo/repro/figure1_dual_lane/run_functional_lane.py \
                --lane current \
                --output-dir /results/figure1-current
            '

      - name: Compare numerical results
        shell: bash
        run: |
          set -euo pipefail
          python repro/figure1_dual_lane/compare_functional.py \
            --legacy-result "$RESULT_ROOT/figure1-legacy/lane_result.json" \
            --current-result "$RESULT_ROOT/figure1-current/lane_result.json" \
            --output-dir "$RESULT_ROOT/figure1-compared"
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["RESULT_ROOT"]) / "figure1-compared"
          print(pd.read_csv(root / "figure1_agreement_metrics.tsv", sep="\t").to_string(index=False))
          print(pd.read_csv(root / "figure1_runtime_memory.tsv", sep="\t").to_string(index=False))
          PY

      - name: Upload the Figure 1 results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfgsea-figure1-v0.2.0-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.RESULT_ROOT }}/comparison-environment.txt
            ${{ env.RESULT_ROOT }}/figure1-legacy/**
            ${{ env.RESULT_ROOT }}/figure1-current/**
            ${{ env.RESULT_ROOT }}/figure1-compared/**
