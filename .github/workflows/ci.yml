name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  # The extension targets CPython's stable ABI from 3.8 onward. PyO3 0.20
  # otherwise rejects newer build interpreters before applying that ABI contract.
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Exercise every CPython line covered by the current release gate.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
      with:
        toolchain: 1.92.0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install maturin==1.10.2 pytest mypy ruff pandas numpy

    - name: Verify Rust sources
      run: |
        cargo fmt --check
        cargo test --locked

    - name: Run Static Checks
      run: |
        ruff check pyfgsea
        mypy pyfgsea --ignore-missing-imports

    - name: Build wheel
      run: maturin build --release --locked --out dist

    - name: Install wheel
      shell: bash
      run: |
        python - <<'PY'
        import glob, sys, subprocess
        whls = glob.glob("dist/*.whl")
        assert whls, "No wheel found in dist/"
        print("Installing:", whls[0])
        subprocess.check_call(
            [
                sys.executable,
                "-m",
                "pip",
                "install",
                "--force-reinstall",
                whls[0] + "[trajectory]",
            ]
        )
        PY

    - name: Run tests against the installed wheel
      shell: bash
      run: |
        python - <<'PY'
        import importlib.metadata
        import os
        from pathlib import Path

        import pytest

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        os.chdir(os.environ["RUNNER_TEMP"])

        import pyfgsea

        package_file = Path(pyfgsea.__file__).resolve()
        assert workspace not in package_file.parents, (
            f"source checkout shadowed installed wheel: {package_file}"
        )
        assert pyfgsea.__version__ == importlib.metadata.version("pyfgsea")

        raise SystemExit(
            pytest.main(
                [
                    "-q",
                    "--import-mode=importlib",
                    str(workspace / "tests"),
                    str(workspace / "repro" / "figure1_dual_lane" / "test_pipeline.py"),
                ]
            )
        )
        PY
