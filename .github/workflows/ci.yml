name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["ted-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl
      - name: Run fast test suite
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          PYTHONPATH=/tmp/ted-test-support python -m pytest "$GITHUB_WORKSPACE/tests" -q -m "not slow and not external and not external_data" --import-mode=importlib
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ted-linux-wheel
          path: dist/*.whl

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install . pytest
      - name: Run integration and schema tests
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          PYTHONPATH=/tmp/ted-test-support python -m pytest -q --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_evidence.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_perturbation.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_known_source_validation.py"

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install . pytest
      - name: Run marked slow tests
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          PYTHONPATH=/tmp/ted-test-support python -m pytest "$GITHUB_WORKSPACE/tests" -q -m slow --import-mode=importlib

  reviewer-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install .
      - name: Run validation demo
        run: |
          python -I scripts/run_ted_validation_demo.py --outdir ci_ted_demo
          ted validate ci_ted_demo/demo_activity.tsv --kind activity --report ci_ted_demo/activity_validation.tsv
          ted validate ci_ted_demo/demo_events.tsv --kind event --report ci_ted_demo/event_validation.tsv
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ted-reviewer-demo
          path: ci_ted_demo/**

  docker-smoke:
    if: startsWith(github.ref, 'refs/tags/ted-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build main image without cache
        run: docker build --no-cache -t ted:1.0.0 .
      - name: Smoke-test main image
        run: |
          docker run --rm ted:1.0.0 ted --help
          docker run --rm ted:1.0.0 python -I scripts/run_ted_validation_demo.py --outdir /tmp/ted_demo
      - name: Build baseline image without cache
        run: docker build --no-cache -f Dockerfile.baselines -t ted-baselines:1.0.0 .
      - name: Smoke-test baseline image
        run: docker run --rm ted-baselines:1.0.0
