[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "pyfgsea"
dynamic = ["version"]
description = "Python-first, Rust-backed gene set enrichment analysis with trajectory support"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy"
]

[project.optional-dependencies]
trajectory = [
    "anndata",
    "scanpy",
    "matplotlib",
    "seaborn"
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "build",
    "maturin"
]

[project.urls]
Homepage = "https://github.com/shayuanxukuang/pyfgsea"
Repository = "https://github.com/shayuanxukuang/pyfgsea"
Issues = "https://github.com/shayuanxukuang/pyfgsea/issues"

[tool.maturin]
module-name = "pyfgsea._core"
locked = true
